name: Update PlayMetrics tournaments

on:
  schedule:
    - cron: '17 10 * * *'   # every day around 6 AM Eastern
  workflow_dispatch:         # "Run workflow" button for a manual update

permissions:
  contents: write

concurrency:
  group: playmetrics-tournaments
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser
        run: |
          npm init -y >/dev/null
          npm install playwright@1.47.2 --no-save
          npx playwright install --with-deps chromium

      - name: Read PlayMetrics
        run: node scripts/playmetrics-tournaments.mjs

      - name: Add logos and tournaments not in PlayMetrics yet
        if: always()
        run: node scripts/merge-extras.mjs

      - name: Build subscribable calendar
        if: always()
        run: node scripts/build-calendar.mjs

      - name: Save changes
        if: always()
        run: |
          git config user.name "ncysa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update PlayMetrics tournaments"
            git push
          fi
