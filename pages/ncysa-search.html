<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  .entry-title { display: none !important; }
  .ss-wrap {
    --navy: #10045a; --navy-2: #1a0a6e; --red: #b82f2f; --red-dark: #9a2626; --gold: #edc32c;
    --cream: #f9f7f7; --ink: #1d1a18; --mute: #5f5a66; --line: #e6e2ea;
    font-family: 'Source Sans 3', system-ui, sans-serif; color: var(--ink); background: var(--cream);
  }
  .ss-wrap *, .ss-wrap *::before, .ss-wrap *::after { box-sizing: border-box; margin: 0; padding: 0; }
  .ss-wrap a { text-decoration: none; }

  /* HERO (same as the other pages) */
  .ss-hero { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 55%, #0d0342 100%); padding: 56px 24px 116px; text-align: center; position: relative; overflow: hidden; }
  .ss-hero::after { content: ''; position: absolute; left: 0; right: 0; bottom: -2px; height: 80px; background: var(--cream); clip-path: ellipse(55% 100% at 50% 100%); }
  .ss-kicker { display: inline-flex; align-items: center; gap: 8px; background: rgba(184,47,47,0.15); border: 1px solid rgba(184,47,47,0.4); border-radius: 50px; padding: 8px 20px; margin-bottom: 26px; color: rgba(255,255,255,0.9); font-size: 0.85rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
  .ss-kicker svg { width: 16px; height: 16px; stroke: var(--red); fill: none; stroke-width: 2; stroke-linecap: round; }
  .ss-hero h1 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: clamp(2.6rem, 6vw, 4rem); line-height: 1; letter-spacing: 0.03em; color: #fff; margin-bottom: 14px; }
  .ss-hero h1 span { color: var(--red); }
  .ss-hero p { color: rgba(255,255,255,0.8); font-size: 1.05rem; line-height: 1.6; max-width: 560px; margin: 0 auto; }
  .ss-divider { width: 60px; height: 3px; background: var(--red); border-radius: 2px; margin: 20px auto 0; }

  /* SEARCH CARD */
  .ss-main { max-width: 900px; margin: -78px auto 0; padding: 0 20px 64px; position: relative; z-index: 2; }
  .ss-box { background: #fff; border-radius: 12px; box-shadow: 0 14px 32px rgba(16,4,90,0.16); padding: 18px; }
  .ss-field { position: relative; }
  .ss-field svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; stroke: var(--navy); fill: none; stroke-width: 2.2; stroke-linecap: round; pointer-events: none; }
  .ss-wrap input.ss-input { width: 100%; font: 600 1.15rem 'Source Sans 3', sans-serif; color: var(--ink); padding: 15px 44px 15px 48px; border: 2px solid var(--line); border-radius: 10px; background: var(--cream); outline: none; transition: border-color .2s ease, background .2s ease; }
  .ss-wrap input.ss-input:focus { border-color: var(--navy); background: #fff; }
  .ss-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; border: 0; background: transparent; color: var(--mute); font-size: 20px; line-height: 1; cursor: pointer; display: none; }
  .ss-clear:hover { background: var(--line); }
  .ss-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .ss-chip { font: 600 0.85rem 'Source Sans 3', sans-serif; padding: 7px 14px; border-radius: 50px; border: 1.5px solid var(--line); background: #fff; color: var(--navy); cursor: pointer; transition: all .2s ease; }
  .ss-chip:hover { border-color: var(--navy); }
  .ss-chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
  .ss-chip .n { opacity: .7; margin-left: 4px; font-weight: 700; }
  .ss-chip:focus-visible, .ss-res:focus-visible, .ss-try:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* RESULTS */
  .ss-status { margin: 22px 2px 10px; font-size: 0.9rem; color: var(--mute); }
  .ss-list { display: flex; flex-direction: column; gap: 10px; }
  .ss-res { display: flex; align-items: center; gap: 14px; padding: 15px 18px; background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--navy); border-radius: 10px; color: var(--ink); transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
  .ss-res:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(16,4,90,0.12); border-left-color: var(--red); }
  .ss-res .ic { flex: 0 0 40px; width: 40px; height: 40px; border-radius: 10px; background: var(--cream); display: flex; align-items: center; justify-content: center; }
  .ss-res .ic svg { width: 20px; height: 20px; stroke: var(--navy); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ss-res .tx { flex: 1; min-width: 0; }
  .ss-res strong { display: block; color: var(--navy); font-size: 1.05rem; font-weight: 700; line-height: 1.3; }
  .ss-res .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 3px 0 2px; }
  .ss-res .tag { font-size: 0.7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--red); }
  .ss-res .sec { font-size: 0.8rem; color: var(--mute); }
  .ss-res .sum { color: var(--mute); font-size: 0.9rem; line-height: 1.45; overflow-wrap: anywhere; }
  .ss-res mark { background: rgba(237,195,44,0.35); color: inherit; border-radius: 2px; padding: 0 1px; }
  .ss-res .go { flex: 0 0 18px; width: 18px; height: 18px; stroke: var(--red); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s ease; }
  .ss-res:hover .go { transform: translateX(3px); }
  .ss-more { display: block; margin: 16px auto 0; font: 700 0.9rem 'Source Sans 3', sans-serif; letter-spacing: .06em; text-transform: uppercase; padding: 12px 26px; border-radius: 8px; border: 2px solid var(--navy); background: #fff; color: var(--navy); cursor: pointer; }
  .ss-more:hover { background: var(--navy); color: #fff; }

  /* EMPTY STATE */
  .ss-start h3 { font-size: 0.8rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--red); margin: 26px 2px 12px; }
  .ss-tries { display: flex; flex-wrap: wrap; gap: 8px; }
  .ss-try { font: 600 0.92rem 'Source Sans 3', sans-serif; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); border-left: 3px solid var(--navy); background: #fff; color: var(--navy); cursor: pointer; transition: border-color .2s ease, transform .2s ease; }
  .ss-try:hover { border-left-color: var(--red); transform: translateY(-1px); }
  .ss-none { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 22px; text-align: center; color: var(--mute); line-height: 1.6; }
  .ss-none a { color: var(--red); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }

  /* HELP BAND (same as the other pages) */
  .ss-help { background: var(--navy); padding: 100px 24px 60px; text-align: center; position: relative; }
  .ss-help::before { content: ''; position: absolute; top: -2px; left: 0; right: 0; height: 80px; background: var(--cream); clip-path: ellipse(55% 100% at 50% 0%); }
  .ss-help > * { position: relative; z-index: 1; }
  .ss-help h2 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: clamp(2rem, 5vw, 2.8rem); letter-spacing: 0.03em; color: #fff; margin-bottom: 8px; }
  .ss-help p { color: rgba(255,255,255,0.8); font-size: 1.02rem; line-height: 1.6; max-width: 520px; margin: 0 auto 24px; }
  .ss-wrap a.ss-btn { display: inline-block; padding: 13px 28px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; letter-spacing: 0.06em; text-transform: uppercase; background: var(--red); color: #fff; -webkit-text-fill-color: #fff; transition: transform .2s ease, background .2s ease; }
  .ss-wrap a.ss-btn:hover { background: var(--red-dark); color: #fff; transform: translateY(-2px); }

  @media (max-width: 600px) {
    .ss-hero { padding: 44px 20px 104px; }
    .ss-box { padding: 14px; }
    .ss-res { padding: 13px 14px; }
    .ss-res .ic { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .ss-wrap * { transition: none !important; } }
</style>

      }
      if (!ok) return;
      if (it.nt === phrase) score += 25; else if (it.nt.indexOf(phrase) === 0) score += 12; else if (it.nt.indexOf(phrase) > -1) score += 6;
      if (it.t === 'p') score += 3;
      score += (it.pr - 1) * 4;
      if (it.t === 'e' || it.t === 't') score -= 1;
      res.push({ it: it, s: score });
    });
    res.sort(function (a, b) { return b.s - a.s || a.it.title.length - b.it.title.length; });
    return { res: res.map(function (r) { return r.it; }), terms: terms };
  }

  function drawChips(res) {
    var counts = { all: res.length }; Object.keys(TYPES).forEach(function (k) { counts[k] = 0; });
    res.forEach(function (it) { counts[it.t]++; });
    var html = '<button type="button" class="ss-chip" data-f="all" aria-pressed="' + (filter === 'all') + '">All<span class="n">' + counts.all + '</span></button>';
    Object.keys(TYPES).forEach(function (k) {
      if (!counts[k] && filter !== k) return;
      html += '<button type="button" class="ss-chip" data-f="' + k + '" aria-pressed="' + (filter === k) + '">' + TYPES[k].label + '<span class="n">' + counts[k] + '</span></button>';
    });
    chipsEl.innerHTML = res.length ? html : '';
  }

  function card(it, terms) {
    var T = TYPES[it.t], sub = it.t === 'e' ? (CAT[it.sub] || it.sub) : it.sub, ext = isExternal(it.url);
    var sum = it.t === 'e' ? it.sum : it.sum;
    return '<a class="ss-res" href="' + esc(href(it.url)) + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>' +
      '<span class="ic"><svg viewBox="0 0 24 24">' + T.icon + '</svg></span>' +
      '<span class="tx"><strong>' + hl(it.title, terms) + '</strong>' +
      '<span class="meta"><span class="tag">' + T.one + '</span>' + (sub ? '<span class="sec">· ' + esc(sub) + '</span>' : '') + '</span>' +
      (sum ? '<span class="sum">' + hl(sum, terms) + '</span>' : '') + '</span>' +
      '<svg class="go" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>';
  }

  function startState() {
    chipsEl.innerHTML = ''; statusEl.textContent = '';
    listEl.innerHTML = '';
    extraEl.innerHTML = '<div class="ss-start"><h3>Popular Searches</h3><div class="ss-tries">' +
      TRIES.map(function (t) { return '<button type="button" class="ss-try">' + esc(t) + '</button>'; }).join('') + '</div></div>';
  }

  function render() {
    var q = qEl.value;
    clearEl.style.display = q ? 'block' : 'none';
    if (!norm(q)) { startState(); return; }
    var out = search(q); lastRes = out.res; lastTerms = out.terms;
    drawChips(lastRes);
    var res = filter === 'all' ? lastRes : lastRes.filter(function (it) { return it.t === filter; });
    statusEl.textContent = res.length ? res.length + ' result' + (res.length === 1 ? '' : 's') + ' for “' + q.trim() + '”' : '';
    if (!res.length) {
      listEl.innerHTML = '<div class="ss-none">No results for “' + esc(q.trim()) + '”. Try fewer or different words, or <a href="https://www.ncsoccer.org/contact-us/">contact our staff</a>.</div>';
      extraEl.innerHTML = ''; return;
    }
    listEl.innerHTML = res.slice(0, shown).map(function (it) { return card(it, lastTerms); }).join('');
    extraEl.innerHTML = res.length > shown ? '<button type="button" class="ss-more" id="ss-more">Show more results</button>' : '';
  }

  var timer;
  qEl.addEventListener('input', function () { clearTimeout(timer); shown = 25; filter = 'all'; timer = setTimeout(function () { render(); syncUrl(); }, 120); });
  clearEl.addEventListener('click', function () { qEl.value = ''; filter = 'all'; render(); syncUrl(); qEl.focus(); });
  chipsEl.addEventListener('click', function (e) { var b = e.target.closest('.ss-chip'); if (!b) return; filter = b.dataset.f; shown = 25; render(); });
  extraEl.addEventListener('click', function (e) {
    if (e.target.id === 'ss-more') { shown += 25; render(); return; }
    var t = e.target.closest('.ss-try'); if (t) { qEl.value = t.textContent; filter = 'all'; render(); syncUrl(); qEl.focus(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== qEl && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); qEl.focus(); }
  });
  function syncUrl() {
    try { var u = new URL(location.href); if (qEl.value.trim()) u.searchParams.set('q', qEl.value.trim()); else u.searchParams.delete('q'); history.replaceState(null, '', u); } catch (err) {}
  }
  try { var q0 = new URL(location.href).searchParams.get('q'); if (q0) qEl.value = q0; } catch (err) {}
  render();
})();
</script>
